name: Cargar JSONs a MongoDB - AR&AP 183800

on:
  push:
    branches:
      - development
      - feature/183800
  workflow_dispatch:

jobs:
  cargar-mongo:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Mongo Tools
        run: |
          wget https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-100.9.4.deb
          sudo dpkg -i mongodb-database-tools-*.deb

      - name: Importar JSONs a colección ARAP
        run: |
          echo "Buscando archivos JSON en la carpeta AR&AP..."
          for filepath in "AR&AP"/*.json; do
            if [ -f "$filepath" ]; then
              echo "Cargando archivo: $filepath"
              mongoimport --host 127.0.0.1 --port 27017 --db erpdb --collection ARAP --file "$filepath" --jsonArray
            fi
          done
